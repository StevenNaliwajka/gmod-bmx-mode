name: Suggestion
description: A game, a scoring rule, a bot trick or something else you would like to see.
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: One idea per issue works best.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What for?
      description: What would you do with it, or what is annoying without it?
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Kind of thing
      options:
        - A new game or game rule
        - Scoring or the leaderboard
        - The trick bot
        - Menus or HUD
        - Something else
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example
      description: A video or a link to something that does it well.
    validations:
      required: false
